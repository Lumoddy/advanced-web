
replacements:

  column:
  - - { type: ID }
    - { type: INT, signed: false }
  - - { type: ENUM }
    - { type: TINYINT, signed: false }
  - - { type: NAME }
    - { type: VARCHAR, size: (2**8)-1 }
  - - { type: HASH }
    - { type: VARCHAR, size: (2**8)-1 }
  - - { type: TITLE }
    - { type: VARCHAR, size: (2**10)-1 }
  - - { type: DESCRIPTION }
    - { type: TEXT }

tables:

  images:
    columns:
      image_id: { PHP Short Single: id, type: ID }
      image_description: { PHP Short Single: description, type: DESCRIPTION }
    constraints:
    - primary_key:
      - image_id

  accounts:
    columns:
      account_id: { PHP Short Single: id, type: ID }
      account_username: { PHP Short Single: username, type: VARCHAR, size: 31 }
      account_email: { PHP Short Single: email, type: VARCHAR, size: 320 }
      account_password_hash: { PHP Short Single: password_hash, type: HASH }
    constraints:
    - primary_key:
      - account_id
    - unique_key:
      - account_email

  media:
    PHP Single: media
    columns:
      media_id: { PHP Short Single: id, type: ID }
      media_title: { PHP Short Single: title, type: TITLE }
      media_description: { PHP Short Single: description, type: DESCRIPTION }
      media_cover_image_id: { PHP Short Single: cover_image_id, type: ID }
      media_release_date: { PHP Short Single: release_date, type: DATE }
    constraints:
    - primary_key:
      - media_id
    - foreign_key:
      - - media_cover_image_id
      - images:
        - image_id

  people:
    PHP Single: person
    columns:
      person_id: { PHP Short Single: id, type: ID }
      person_full_name: { PHP Short Single: full_name, type: NAME }
      person_description: { PHP Short Single: description, type: DESCRIPTION }
    constraints:
    - primary_key:
      - person_id

  ratings:
    columns:
      account_id: { PHP Short Single: account_id, type: ID }
      media_id: { PHP Short Single: media_id, type: ID }
      rating_rating: { PHP Short Single: rating, type: TINYINT, signed: false }
    constraints:
    - primary_key:
      - account_id
      - media_id
    - foreign_key:
      - - account_id
      - accounts:
        - account_id
    - foreign_key:
      - - media_id
      - media:
        - media_id

  movies:
    columns:
      media_id: { PHP Short Single: id, type: ID }
      movie_length_minutes: { PHP Short Single: minutes, type: SMALLINT, signed: false }
    constraints:
    - primary_key:
      - media_id
    - foreign_key:
      - - media_id
      - media:
        - media_id

  genre_of_media:
    PHP Single: genre_of_media
    columns:
      media_id: { PHP Short Single: media_id, type: ID }
      genre: { PHP Short Single: genre, type: ENUM }
    constraints:
    - primary_key:
      - media_id
      - genre
    - foreign_key:
      - - media_id
      - media:
        - media_id
    - foreign_key:
      - - genre
      - genres:
        - genre_id

  genres:
    columns:
      genre_id: { PHP Short Single: id, type: ENUM }
      genre: { PHP Short Single: name, type: NAME }
    constraints:
    - primary_key:
      - genre_id
    - unique_key:
      - genre

  people_in_media:
    PHP Single: person_in_media
    columns:
      person_id: { PHP Short Single: person_id, type: ID }
      media_id: { PHP Short Single: media_id, type: ID }
      person_in_media_job: { PHP Short Single: job, type: ENUM }
    constraints:
    - primary_key:
      - person_id
      - media_id
      - person_in_media_job
    - key:
      - media_id
      - person_in_media_job
    - foreign_key:
      - - media_id
      - media:
        - media_id
    - foreign_key:
      - - person_id
      - people:
        - person_id
    - foreign_key:
      - - person_in_media_job
      - person_in_media_jobs:
        - person_in_media_job_id

  person_in_media_jobs:
    columns:
      person_in_media_job_id: { PHP Short Single: id, type: ENUM }
      person_in_media_job: { PHP Short Single: name, type: NAME }
    constraints:
    - primary_key:
      - person_in_media_job_id
    - unique_key:
      - person_in_media_job

  reviews:
    columns:
      account_id: { PHP Short Single: account_id, type: ID }
      media_id: { PHP Short Single: media_id, type: ID }
      review_content: { PHP Short Single: content, type: DESCRIPTION }
    constraints:
    - primary_key:
      - account_id
      - media_id
    - foreign_key:
      - - account_id
        - media_id
      - ratings:
        - account_id
        - media_id