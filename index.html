<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button id="push" onclick='history.pushState("test", "", "/")'>Push</button>
  <button id="back" onclick='history.back()'>Back</button>
  <button id="forward" onclick='history.forward()'>Forward</button>
  <label><input type="checkbox" id="cancel"></input> Cancel</label>
  <a id="link" href="/">Link</a>
  <a id="interrupted" href="/">Interrupted</a>
  <script>
    document.getElementById("interrupted").addEventListener("click", (e) =>
    {
      e.preventDefault();
    });

    window.addEventListener("popstate", (e) =>
    {
      if (document.getElementById("cancel").checked)
        e.preventDefault();

      document.body.append(
        document.createElement("br"),
        `location: ${location.pathname}, state: ${JSON.stringify(event.state)}`);
    });
  </script>
</body>
</html>
