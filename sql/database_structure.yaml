replacements:
  - - { type: ID }
    - { type: INT, signed: false }
tables:
  images:
    single: image
    columns:
    - { name: id, type: ID }
    - { name: description, type: VARCHAR, size: 1023 }
    constraints:
    - primary: [id]
  accounts:
    single: account
    columns:
    - { name: id, type: ID }
    - { name: username, type: VARCHAR, size: 127 }
    - { name: email, type: VARCHAR, size: 255 }
    - { name: password_hash, type: VARCHAR, size: 255 }
    constraints:
    - primary: [id]
    - unique: [email]
  media:
    single: media
    columns:
    - { name: id, type: ID }
    - { name: title, type: VARCHAR, size: 1023 }
    - { name: description, type: VARCHAR, size: 4095 }
    - { name: cover, type: INT, signed: false }
    constraints:
    - primary: [id]
    - foreign: { from: [cover], images: [id] }
  people:
    single: person
    columns:
    - { name: id, type: ID }
    - { name: full_name, type: VARCHAR, size: 1023 }
    - { name: description, type: VARCHAR, size: 4095 }
    constraints:
    - primary: [id]
    - foreign: { from: [cover], images: [id] }
  ratings:
    single: rating
    columns:
    - { name: account_id, type: ID }
    - { name: media_id, type: ID }
    - { name: rating, type: TINYINT, signed: false }
    constraints:
    - unique: [account_id, media_id]
    - foreign: { from: [account_id], accounts: [id] }
    - foreign: { from: [media_id], media: [id] }
  movies:
    single: movie
    columns:
    - { name: id, type: ID }
    - { name: minutes, type: SMALLINT, signed: false }
    constraints:
    - primary: [id]
    - foreign: { from: [id], media: [id] }
  people_in_media:
    single: person_in_media
    columns:
    - { name: person_id, type: ID }
    - { name: media_id, type: ID }
    constraints:
    - unique: [person_id, media_id]
    - foreign: { from: [media_id], media: [id] }
    - foreign: { from: [person_id], people: [id] }
  reviews:
    single: review
    columns:
    - { name: account_id, type: ID }
    - { name: media_id, type: ID }
    - { name: content, type: VARCHAR, size: 1023 }
    constraints:
    - unique: [account_id, media_id]
    - foreign: { from: [account_id], ratings: [account_id] }
    - foreign: { from: [media_id], ratings: [media_id] }